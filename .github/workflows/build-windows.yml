
name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CXXFLAGS: /DNOMINMAX
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPOLYBRISK_COPY_PLUGIN=OFF -DPOLYBRISK_DEV_IDENTITY=OFF

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target PolyBrisk_VST3 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Show errors
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path build.log -Pattern 'error [A-Z]+\d+' | ForEach-Object { $_.Line }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: POLYBRISK-Windows-VST3
          path: build/PolyBrisk_artefacts/Release/VST3/

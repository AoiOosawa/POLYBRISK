name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DPOLYBRISK_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: List outputs
        shell: bash
        run: find build -name "*.vst3" -maxdepth 6

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: POLYBRISK-Windows-VST3
          path: build/**/VST3/**
          if-no-files-found: warn

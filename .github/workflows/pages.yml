# 製品ページ (site/) を GitHub Pages に公開する。ビルドは不要 (依存なしの静的 HTML)。
#   https://cheebow.github.io/POLYBRISK/
# リポジトリの設定: Settings → Pages → Source: GitHub Actions
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 最小権限: リポジトリは読むだけ。公開できるのは deploy ジョブだけ
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

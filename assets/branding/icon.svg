<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- POLYBRISK app icon (provisional). macOS grid: 824px rounded square on a 1024px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d4a"/>
      <stop offset="1" stop-color="#0d0e17"/>
    </linearGradient>
    <linearGradient id="saw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd23c"/>
      <stop offset="0.55" stop-color="#ff6a3c"/>
      <stop offset="1" stop-color="#ff3c8e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ff6a3c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- detuned saw layers -->
    <path d="M196 598 L374 346 L374 598 L552 346 L552 598 L730 346 L730 598" stroke="#3cd6ff" stroke-opacity="0.55" stroke-width="34"/>
    <path d="M250 706 L462 438 L462 706 L674 438 L674 706 L828 511" stroke="#8a6bff" stroke-opacity="0.6" stroke-width="34"/>
    <!-- centre saw -->
    <path d="M214 656 L410 388 L410 656 L606 388 L606 656 L802 388 L802 656" stroke="url(#saw)" stroke-width="52"/>
  </g>
</svg>
